<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" class="auth-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Trail Ridge Off-Road</title>
<meta name="description" content="Create your Trail Ridge account to book ATV, UTV and dirt bike rentals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../home/style.css">
<link rel="stylesheet" href="auth.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='24' cy='72' r='15' fill='none' stroke='%23221B14' stroke-width='5'/%3E%3Ccircle cx='24' cy='72' r='4' fill='%23B84E27'/%3E%3Ccircle cx='76' cy='72' r='15' fill='none' stroke='%23221B14' stroke-width='5'/%3E%3Ccircle cx='76' cy='72' r='4' fill='%23B84E27'/%3E%3Cpath d='M24 72 L38 44 L62 44 L76 72' stroke='%23B84E27' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M38 44 L38 24' stroke='%23221B14' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M28 22 L48 22' stroke='%23221B14' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
</head>

<body class="auth-page">

<div class="top-controls">
  <button class="btn btn-outline btn-sm" id="dir-toggle" aria-label="Toggle text direction">RTL</button>

  <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1L5.6 5.6" stroke-linecap="round"/>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<main class="auth-main">
  <div class="auth-card wide">

    <a href="../home/index.html" class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <circle cx="24" cy="72" r="15" fill="none" stroke="var(--logo-ink)" stroke-width="5"/>
          <circle cx="24" cy="72" r="4" fill="var(--logo-rust)"/>
          <circle cx="76" cy="72" r="15" fill="none" stroke="var(--logo-ink)" stroke-width="5"/>
          <circle cx="76" cy="72" r="4" fill="var(--logo-rust)"/>
          <path d="M24 72 L38 44 L62 44 L76 72" stroke="var(--logo-rust)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M38 44 L38 24" stroke="var(--logo-ink)" stroke-width="5" stroke-linecap="round"/>
          <path d="M28 22 L48 22" stroke="var(--logo-ink)" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="logo-word">TRAIL<em>RIDGE</em></span><br>
        <span class="brand-sub">ATV &amp; Off-Road Rentals</span>
      </span>
    </a>

    <div class="auth-heading">
      <h1>Create your account</h1>
      <p>Set up your profile to book your first rental or guided tour.</p>
    </div>

    <form id="signup-form" class="auth-form" novalidate>

      <div class="field-row">
        <div class="field">
          <label for="fname">First name</label>
          <input type="text" id="fname" name="fname" placeholder="First name" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label for="lname">Last name</label>
          <input type="text" id="lname" name="lname" placeholder="Last name" autocomplete="family-name" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" autocomplete="tel" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="password">Password</label>
          <div class="field-wrap">
            <input type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="field-wrap">
            <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" data-target="confirm" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
      </div>

      <label class="checkline">
        <input type="checkbox" id="agree" name="agree" required>
        <span>I agree to Trail Ridge's <a href="../additional-pages/terms.html">Terms</a> and <a href="../additional-pages/privacy.html">Privacy Policy</a>.</span>
      </label>

      <button type="submit" class="btn btn-primary auth-submit">
        Create account
      </button>

    </form>

    <div class="auth-divider">or continue with</div>

    <div class="social-row">
      <button type="button" class="social-btn" aria-label="Continue with Google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.6-.2-2.36H12v4.47h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.74z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.92l-3.87-3c-1.08.72-2.46 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.94H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.29 14.29a7.2 7.2 0 0 1 0-4.58v-3.1H1.3a12 12 0 0 0 0 10.78z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.35.6 4.6 1.8l3.44-3.44C17.94 1.19 15.24 0 12 0A12 12 0 0 0 1.3 6.61l3.99 3.1C6.23 6.87 8.88 4.75 12 4.75z"/></svg>
      </button>
      <button type="button" class="social-btn" aria-label="Continue with Apple">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 1c.15 1.19-.35 2.4-1.05 3.24-.72.86-1.94 1.52-3.06 1.44-.17-1.16.4-2.37 1.06-3.14C14.2 1.62 15.45 1.05 16.5 1zM20.6 17.1c-.47 1.08-.7 1.56-1.3 2.53-.85 1.34-2.04 3.01-3.53 3.02-1.32.02-1.66-.86-3.46-.85-1.8.01-2.18.87-3.5.85-1.48-.02-2.62-1.53-3.47-2.86C2.87 17.19 2.2 13.4 3.35 10.79c.82-1.86 2.31-3.03 3.9-3.05 1.42-.02 2.32.94 3.5.94 1.17 0 1.87-.94 3.51-.94 1.22 0 2.51.66 3.44 1.8-3.02 1.66-2.53 5.98.9 7.56z"/></svg>
      </button>
      <button type="button" class="social-btn" aria-label="Continue with Facebook">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M15.4 15.4l.5-3.4h-3.2v-2.2c0-.93.32-1.68 1.75-1.68h1.5V4.98C15.4 4.9 14.2 4.8 13 4.8c-2.5 0-4.2 1.5-4.2 4.3V12H6.2v3.4h2.6V22h3.3v-6.6h3.3z"/></svg>
      </button>
    </div>

    <p class="auth-foot">Already have an account? <a href="login.html" class="link">Log in</a></p>

  </div>
</main>

<script>
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  document.getElementById('signup-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (pw !== confirm) {
      alert("Passwords don't match — please re-enter.");
      return;
    }
    alert('Account created — connect this form to your backend to finish signup.');
  });
</script>
<script src="../home/script.js"></script>
</body>
</html>
